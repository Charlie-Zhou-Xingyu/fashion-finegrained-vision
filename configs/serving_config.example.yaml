# P0a.1 — Serving layer configuration.
# Values here will be consumed by inference/serving/deps.py.
# Do NOT hard-code these in application code.

service:
  name: "fashion-vision-serving"
  version: "p0a-api-schema"
  description: "P0a API schema skeleton — services not yet implemented."

schema:
  version: "1.0.0"

health:
  implemented_modules:
    - schemas
    - app
    - deps
    - intent_classifier
    - attribute_service
    - rag_service
    - qa_orchestrator
    - vision_provider_mock
    - vision_provider_real_adapter   # P1.1 experimental shell (disabled by default)
    - content_generation_service
    - mllm_client                         # P2 mock tier (see mllm: block below)
    - rag_hybrid_retrieval                # P2 dense+rerank fusion (off by default, see rag: block)
    - grounded_generation                 # P2 cited MLLM answers (off by default, see rag: block)
  pending_modules:
    - rag_service
    - qa_orchestrator
    - content_service
    - cache_service
    - small_llm
    - mllm_client_real                    # P2 real tier — needs GPU server + built engine
    - vision_backend_fashion_vision_3_1   # real 3.1 invocation not wired in P1.1

# P1.1 — Vision provider selection (feature flag).
# Default is ALWAYS mock.  Real provider only activates when BOTH
# provider=real AND real_enabled=true (or the env-var equivalents:
# VISION_PROVIDER / VISION_REAL_ENABLED / VISION_TIMEOUT_MS / VISION_CHECKPOINT_ROOT).
vision:
  provider: mock            # mock | real
  real_enabled: false
  real_provider:
    backend: fashion_vision_3_1
    mode: segmentation_only              # segmentation_only (P1.2) | null (P1.1 probing)
    checkpoint_root: outputs/
    timeout_ms: 10000                    # raised for CPU SAM (override on GPU servers)
    max_image_bytes: 5242880             # 5 MiB (applies to the raw image_bytes payload)
    allow_image_url_download: false      # P1.1: never download image_url
    fail_open_to_mock: true
    yolo_device: cpu                     # cpu | cuda | auto (auto → CUDA if available)
    sam_device: cpu                      # cpu | cuda | auto
    cleanup_temp_files: true             # remove temp dirs in finally block

# P1.4b — Region localization backend (3.1.2).
# Default is ALWAYS disabled.  Real backend only activates when
# backend=fashionpedia (or full) AND enable_real=true.
region_backend:
  backend: disabled               # disabled | fashionpedia | full
  enable_real: false
  model_path: models/detectors/fashionpedia_yolov8s_19cls_balanced_v1_best.pt
  device: cpu                     # cpu | cuda | auto
  confidence_threshold: 0.5
  timeout_ms: 5000

# P1.4f — 3.1.3 attribute extraction backend.
# Default is ALWAYS disabled.  Real backend only activates when enable_real=true.
attribute_backend:
  backend: disabled               # disabled | fashionai | 313 | real
  enable_real: false
  device: cpu                     # cpu | cuda

# P2 — Multimodal LLM client selection (3.2 module, Qwen-VL-7B-Chat).
# Default is ALWAYS mock (never fabricates an answer).  Real backend only
# activates when BOTH provider=real AND real_enabled=true (or the env-var
# equivalents: MLLM_PROVIDER / MLLM_REAL_ENABLED / MLLM_ENDPOINT / MLLM_MODEL).
# The endpoint is served by inference/serving/trtllm_server.py on a GPU
# server (TensorRT-LLM, PagedAttention + INT4-AWQ weights + INT8 KV cache);
# see docs/tensorrt_llm_integration.md for how to build and run it.
mllm:
  provider: mock             # mock | real
  real_enabled: false
  endpoint: "http://localhost:8082"
  model: "qwen-vl-7b-chat"
  timeout_s: 5.0
  max_retries: 1
  fail_open_to_mock: true    # HTTP/engine failure degrades to mock, never crashes the request

# P0a mock — will be replaced by IntentRouter in P0a.2.
mock:
  visual_keywords:
    - 图片
    - 看图
    - 图里
    - 这张图
    - 图中
    - 照片
    - 看看
  qa_answer: "P0a API schema is ready. Intent routing and services will be implemented in later steps."
  need_image_clarification: "该问题需要商品图片来进行视觉分析，请上传图片后重试。"

# P2 — RAG enhancements (PRD §3.3).  Every switch defaults to OFF so the
# deterministic lexical RagService is the baseline; each real component fails
# open to it with a warning.  Env overrides: RAG_DENSE_ENABLED,
# RAG_RERANKER_ENABLED, RAG_GENERATION_ENABLED, RAG_ALLOW_MODEL_DOWNLOAD,
# RAG_EMBEDDING_MODEL, RAG_RERANKER_MODEL, RAG_INDEX_CACHE_DIR, RAG_DEVICE.
rag:
  dense:
    enabled: false
    embedding_model: BAAI/bge-m3         # hub id or LOCAL DIRECTORY (~2.2 GB); dense vectors only.
                                         # Offline deployments should point at a directory: with
                                         # allow_model_download=false FlagEmbedding insists the hub
                                         # cache snapshot is byte-complete (README, onnx/, ...).
    index_backend: faiss                 # faiss (exact IndexFlatIP) | numpy (exact matmul, no extra
                                         # deps; use on macOS where pip faiss + torch clash on libomp).
                                         # chroma is not implemented.
    index_cache_dir: outputs/rag_index   # embeddings cached by (model, kb_version, docs) fingerprint
    allow_model_download: false          # false → HF offline; missing weights = fall back to lexical
    device: cpu                          # cpu | cuda | mps
    fusion: rrf                          # reciprocal rank fusion with the lexical ranking
    rrf_k: 60
    candidate_multiplier: 3              # dense candidates = top_k * 3
  reranker:
    enabled: false
    model: BAAI/bge-reranker-v2-m3       # cross-encoder; sigmoid scores replace fused scores
    top_n: 10                            # rerank at most this many (never fewer than top_k)
    min_score: 0.0                       # evidence gate on the reranker's sigmoid score; 0 = off.
                                         # Observed on the 15-doc KB (CPU smoke test): on-topic
                                         # queries 0.11–0.63, off-KB queries 0.00–0.06. Untuned —
                                         # set from a labelled query set before relying on it.
  generation:
    enabled: false                       # use mllm_client for a cited answer on the knowledge route
    max_context_hits: 3
    max_new_tokens: 256
    require_citation: true               # uncited reply → template answer + warning
